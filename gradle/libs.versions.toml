[versions]
# Gradle Plugin (8.7.2 is stable, 8.10 doesn't exist yet)
agp = "8.7.2"

# Kotlin (Downgrade from imaginary 2.2.20 to stable 2.0.21)
kotlin = "2.0.21"

# KSP (Must strictly match the Kotlin version above)
# Format is: [KotlinVersion]-[KspRevision]
kotlinxDatetime = "0.6.2"
ksp = "2.0.21-1.0.25"

# Compose Multiplatform (1.9.0 is Android Compose version, JB Compose is at 1.7.0)
composeMultiplatform = "1.7.0"

# Keep the rest as you had them, assuming they are valid
androidNdk27 = "11.15.2"
firebaseCommon = "1.13.1"
geoCompose = "0.8.0"
kotlinxCoroutinesCore = "1.9.0"
mapbox = "11.2.0"
android-compileSdk = "35" # 36 is experimental/preview, 35 is Android 15
android-minSdk = "24"
android-targetSdk = "35"
androidx-activity = "1.9.3"
androidx-appcompat = "1.7.0"
androidx-core = "1.13.1"
androidx-espresso = "3.6.1"
androidx-lifecycle = "2.8.3"
androidx-testExt = "1.2.1"
coilCompose = "2.7.0"
composeMultiplatformFilePicker = "2.7.1"
coreSplashscreen = "1.0.1"
geo = "0.8.0"
googlePlugin =  "4.4.4"
icons =  "1.7.5"
firebasePlugin = "3.0.2"
junit = "4.13.2"
kamelImage = "0.9.5" # Update Kamel to stable
koinComposeViewmodel = "1.2.0-Beta4" # Verify this specific to your lib
koin = "4.0.0" # Koin 4.0 is stable now
ktorfit = "2.1.0" # Update Ktorfit (1.12 is old)
ktor = "3.0.0"
firebase-gitlive = "1.13.0"
kotlinx-serialization = "1.7.3"
lifecycleRuntimeCompose = "2.8.3"
mapboxMapsIos = "11.4.0"
mapsCompose = "4.4.1"
mapsComposeNdk27 = "11.15.2"
permissions = "0.18.0"
permissionsCompose = "0.18.0"
permissionsLocation = "0.18.0"
permissionsVersion = "0.18.0"
playServicesLocation = "21.3.0"
playServicesMaps = "19.0.0"
room = "2.7.0-alpha11"
sqlite = "2.5.0-alpha11"

multiplatform-settings = "1.2.0"
compose-plugin = "1.7.0"
firebase-bom = "33.5.1"
firebase-crashlytics-plugin = "3.0.2"
google-play-services = "4.4.2"
filekit = "0.8.7"

[libraries]
android-ndk27 = { module = "com.mapbox.maps:android-ndk27", version.ref = "androidNdk27" }
androidx-ui-android = { module = "androidx.compose.ui:ui-android" }
geo-compose = { module = "dev.icerock.moko:geo-compose", version.ref = "geoCompose" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
mapbox = { module = "com.mapbox.maps:android", version.ref = "mapbox" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
compose-multiplatform-file-picker = { module = "com.github.Wavesonics:compose-multiplatform-file-picker", version.ref = "composeMultiplatformFilePicker" }
geo = { module = "dev.icerock.moko:geo", version.ref = "geo" }
icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "icons" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coilCompose" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-crashlyticsKtx = { module = "com.google.firebase:firebase-crashlytics-ktx" }
kamel-image = { module = "media.kamel:kamel-image", version.ref = "kamelImage" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

# KMP Serialization (Obrigatório para Ktorfit)
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# -----------------
# KTOR & KTORFIT
# -----------------
ktorfit-lib = { module = "de.jensklingenberg.ktorfit:ktorfit-lib", version.ref = "ktorfit" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
# Engine Ktor (Android)
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
# Engine Ktor (iOS)
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }

# -----------------
# KOIN (Injeção de Dependência)
# -----------------
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = {module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin"}
koin-compose-viewmodel-nav = {module = "io.insert-koin:koin-compose-viewmodel-navigation", version.ref = "koin"}

# -----------------
# FIREBASE KOTLIN SDK (GitLive)
# -----------------
google-firebase-auth = { module = "com.google.firebase:firebase-auth-ktx", version = "23.1.0" }
google-firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics-ktx", version = "19.2.0" }
google-firebase-messaging = { module = "com.google.firebase:firebase-messaging-ktx", version = "24.0.1" }

firebase-auth = { module = "dev.gitlive:firebase-auth", version.ref = "firebase-gitlive" }
firebase-crashlytics = { module = "dev.gitlive:firebase-crashlytics", version.ref = "firebase-gitlive" }
firebase-messaging = { module = "dev.gitlive:firebase-messaging", version.ref = "firebase-gitlive" }
firebase-firestore = { module = "dev.gitlive:firebase-firestore", version.ref = "firebase-gitlive" }
firebase-common = { module = "dev.gitlive:firebase-common", version.ref = "firebase-gitlive" }
# -----------------
# ROOM DATABASE (KMP)
# -----------------
mapbox-maps-ios = { module = "com.mapbox.maps:mapbox-maps-ios", version.ref = "mapboxMapsIos" }
maps-compose = { module = "com.google.maps.android:maps-compose", version.ref = "mapsCompose" }
maps-compose-ndk27 = { module = "com.mapbox.extension:maps-compose-ndk27", version.ref = "mapsComposeNdk27" }
permissions = { module = "dev.icerock.moko:permissions", version.ref = "permissions" }
permissions-compose = { module = "dev.icerock.moko:permissions-compose", version.ref = "permissionsCompose" }
permissions-location = { module = "dev.icerock.moko:permissions-location", version.ref = "permissionsLocation" }
permissions-v0201 = { module = "dev.icerock.moko:permissions", version.ref = "permissionsVersion" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
play-services-maps = { module = "com.google.android.gms:play-services-maps", version.ref = "playServicesMaps" }
# O Runtime do Room
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# O Driver SQLite correto para KMP
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
androidx-room-sqlite-wrapper = { module = "androidx.room:room-sqlite-wrapper", version.ref = "room" }

# -----------------
# MULTIPLATFORM SETTINGS
# -----------------
multiplatform-settings-core = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatform-settings" }
multiplatform-settings-no-arg = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "multiplatform-settings" }
multiplatform-settings-coroutines = { module = "com.russhwolf:multiplatform-settings-coroutines", version.ref = "multiplatform-settings" }

filekit-core = { module = "io.github.vinceglb:filekit-core", version.ref = "filekit" }
filekit-compose = { module = "io.github.vinceglb:filekit-compose", version.ref = "filekit" }

[plugins]
